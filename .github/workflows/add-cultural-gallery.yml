name: Add CSE Picnic 2026 to Cultural Moments

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gallery
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'assets/cse-picnic-2026-01.jpg' not in s:
              s = s.replace('<span class="text-sm text-gray-500">5 photos</span>', '<span class="text-sm text-gray-500">10 photos</span>', 1)
              marker = 'aria-label="Open Cultural Activities photo 5"'
              a = s.find(marker)
              b = s.find('</button>', a)
              b += len('</button>')
              items = ''.join(f'''\n      <button type="button" class="cultural-gallery-item group relative overflow-hidden rounded-2xl border border-white/10 bg-black/20 text-left" onclick="openCulturalLightbox({i+5})" aria-label="Open CSE Picnic 2026 photo {i+1}">\n        <img src="assets/cse-picnic-2026-0{i+1}.jpg" class="w-full h-72 object-cover transition duration-500 group-hover:scale-105" loading="lazy" alt="CSE Picnic 2026 photo {i+1}">\n        <span class="absolute inset-x-0 bottom-0 p-4 bg-gradient-to-t from-black/80 to-transparent text-white font-semibold">CSE Picnic 2026</span>\n      </button>''' for i in range(5))
              s = s[:b] + items + s[b:]
              p.write_text(s, encoding='utf-8')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Add CSE Picnic 2026 to Cultural Moments [skip ci]" && git push)
