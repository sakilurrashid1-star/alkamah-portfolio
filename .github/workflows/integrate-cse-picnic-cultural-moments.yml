name: Integrate CSE Picnic into Cultural Moments

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate CSE Picnic photos into Cultural Moments') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate gallery into existing Cultural Moments section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the old standalone/forced gallery block if present.
          s = re.sub(r'\s*<!-- CSE-PICNIC-2026-FORCE -->.*?</section>\s*', '\n', s, count=1, flags=re.I|re.S)

          marker = '<!-- CSE-PICNIC-2026-IN-CULTURAL-MOMENTS -->'
          if marker in s:
              print('CSE Picnic gallery is already integrated.')
              raise SystemExit(0)

          # Find the existing Cultural Moments text and its containing <section>.
          hit = re.search(r'Cultural\s+Moments', s, flags=re.I)
          if not hit:
              raise SystemExit('Could not find the existing Cultural Moments section.')

          section_start = s.rfind('<section', 0, hit.start())
          if section_start < 0:
              raise SystemExit('Could not find the opening section for Cultural Moments.')

          # Find the matching </section>, accounting for nested sections.
          token_re = re.compile(r'<section\b[^>]*>|</section\s*>', flags=re.I)
          depth = 0
          end = None
          for m in token_re.finditer(s, section_start):
              if m.group(0).lower().startswith('<section'):
                  depth += 1
              else:
                  depth -= 1
                  if depth == 0:
                      end = m.start()
                      break
          if end is None:
              raise SystemExit('Could not find the closing section for Cultural Moments.')

          gallery = r'''
<!-- CSE-PICNIC-2026-IN-CULTURAL-MOMENTS -->
<div class="cse-picnic-2026-gallery" style="margin-top:32px;padding:24px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.12);">
  <div style="text-align:center;margin-bottom:20px;">
    <h3 style="margin:0 0 6px;font-size:clamp(1.25rem,2vw,1.65rem);">CSE Picnic 2026</h3>
    <p style="margin:0;opacity:.72;">Cultural Moments · Presidency University</p>
  </div>
  <div style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;">
    <a href="DSC07337.JPG" target="_blank" rel="noopener" style="grid-column:span 7;display:block;overflow:hidden;border-radius:18px;min-height:300px;">
      <img src="DSC07337.JPG" alt="CSE Picnic 2026 cultural performance" loading="lazy" style="display:block;width:100%;height:100%;min-height:300px;object-fit:cover;transition:transform .35s ease;">
    </a>
    <a href="DSC07351.JPG" target="_blank" rel="noopener" style="grid-column:span 5;display:block;overflow:hidden;border-radius:18px;min-height:300px;">
      <img src="DSC07351.JPG" alt="CSE Picnic 2026 stage moment" loading="lazy" style="display:block;width:100%;height:100%;min-height:300px;object-fit:cover;transition:transform .35s ease;">
    </a>
    <a href="DSC07355.JPG" target="_blank" rel="noopener" style="grid-column:span 4;display:block;overflow:hidden;border-radius:18px;min-height:270px;">
      <img src="DSC07355.JPG" alt="CSE Picnic 2026 audience moment" loading="lazy" style="display:block;width:100%;height:100%;min-height:270px;object-fit:cover;transition:transform .35s ease;">
    </a>
    <a href="DSC07357.JPG" target="_blank" rel="noopener" style="grid-column:span 4;display:block;overflow:hidden;border-radius:18px;min-height:270px;">
      <img src="DSC07357.JPG" alt="CSE Picnic 2026 cultural moment" loading="lazy" style="display:block;width:100%;height:100%;min-height:270px;object-fit:cover;transition:transform .35s ease;">
    </a>
    <a href="DSC07371.JPG" target="_blank" rel="noopener" style="grid-column:span 4;display:block;overflow:hidden;border-radius:18px;min-height:270px;">
      <img src="DSC07371.JPG" alt="CSE Picnic 2026 cultural performance" loading="lazy" style="display:block;width:100%;height:100%;min-height:270px;object-fit:cover;transition:transform .35s ease;">
    </a>
  </div>
  <style>
    .cse-picnic-2026-gallery a:hover img{transform:scale(1.035)}
    @media (max-width:760px){
      .cse-picnic-2026-gallery div[style*="grid-template-columns"]{display:grid!important;grid-template-columns:1fr!important}
      .cse-picnic-2026-gallery a{grid-column:span 1!important;min-height:240px!important}
      .cse-picnic-2026-gallery img{min-height:240px!important}
    }
  </style>
</div>
'''

          s = s[:end] + gallery + s[end:]
          p.write_text(s, encoding='utf-8')
          print('Integrated CSE Picnic 2026 into the existing Cultural Moments section.')
          PY

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Integrate CSE Picnic photos into Cultural Moments"
          git push || true
