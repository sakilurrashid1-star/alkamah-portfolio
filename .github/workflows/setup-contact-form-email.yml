name: Configure contact form email delivery

on:
  push:
    paths:
      - '.github/workflows/setup-contact-form-email.yml'

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure contact form for real email submission
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          target = 'https://formsubmit.co/sakilurrashid@gmail.com'
          if target not in html:
              raise SystemExit('Expected FormSubmit destination not found; no changes made.')

          # FormSubmit needs the browser's native POST. The previous JavaScript
          # handler called preventDefault(), which kept the form in demo mode.
          # Remove only that cancellation call; leave the existing UI/validation intact.
          old = "document.getElementById('contactForm').addEventListener('submit', (e) => {\n            e.preventDefault();"
          new = "document.getElementById('contactForm').addEventListener('submit', (e) => {\n            // Native POST to FormSubmit is intentional: do not call preventDefault()."

          if old in html:
              html = html.replace(old, new, 1)
              print('Removed JavaScript submission cancellation.')
          elif new in html:
              print('Submission cancellation already removed.')
          else:
              raise SystemExit('Expected contact-form submit handler not found; no changes made.')

          # Ensure the fields required by FormSubmit are present.
          html = re.sub(
              r'(<input\\b[^>]*type=[\"\']email[\"\'][^>]*)(>)',
              lambda m: m.group(1) if re.search(r'\\bname\\s*=\\s*[\"\']email[\"\']', m.group(1), re.I) else m.group(1) + ' name="email"' + m.group(2),
              html, count=1, flags=re.I
          )
          html = re.sub(
              r'(<textarea\\b[^>]*)(>)',
              lambda m: m.group(1) if re.search(r'\\bname\\s*=\\s*[\"\']message[\"\']', m.group(1), re.I) else m.group(1) + ' name="message"' + m.group(2),
              html, count=1, flags=re.I
          )

          path.write_text(html, encoding='utf-8')
          print('Contact form is configured for native FormSubmit POST.')

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Fix contact form email submission"
          git push
