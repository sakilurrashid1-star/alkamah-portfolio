name: Add Sports Gallery to Portfolio
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  add-sports-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject sports gallery into homepage
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          start = "<!-- SPORTS-GALLERY-START -->"
          end = "<!-- SPORTS-GALLERY-END -->"
          if start in s and end in s:
              raise SystemExit(0)
          gallery = r'''
          <!-- SPORTS-GALLERY-START -->
          <section id="sports-gallery" aria-label="Sports & Football">
            <style>
              #sports-gallery{margin:80px auto;max-width:1180px;padding:0 20px}
              #sports-gallery .sg-head{text-align:center;margin-bottom:28px}
              #sports-gallery .sg-kicker{letter-spacing:.18em;text-transform:uppercase;font-size:.75rem;opacity:.7}
              #sports-gallery h2{font-size:clamp(2rem,4vw,3.2rem);margin:.35rem 0}
              #sports-gallery .sg-sub{opacity:.72;max-width:700px;margin:0 auto}
              #sports-gallery .sg-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:30px}
              #sports-gallery figure{margin:0;overflow:hidden;border-radius:22px;background:rgba(255,255,255,.05);box-shadow:0 18px 50px rgba(0,0,0,.22)}
              #sports-gallery img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;transition:transform .45s ease}
              #sports-gallery figure:nth-child(2) img{aspect-ratio:3/4}
              #sports-gallery figure:hover img{transform:scale(1.025)}
              #sports-gallery figcaption{padding:14px 16px;font-size:.92rem;opacity:.82}
              @media(max-width:760px){#sports-gallery .sg-grid{grid-template-columns:1fr}#sports-gallery figure:nth-child(2) img{aspect-ratio:16/10}}
            </style>
            <div class="sg-head">
              <div class="sg-kicker">Sports & Football</div>
              <h2>On the Field</h2>
              <p class="sg-sub">Team spirit, competition, leadership and memorable moments from Presidency University CSE football activities.</p>
            </div>
            <div class="sg-grid">
              <figure>
                <img src="assets/sports-football-action.jpg" alt="Presidency University CSE football activities" loading="lazy">
                <figcaption>Football action and team moments.</figcaption>
              </figure>
              <figure>
                <img src="assets/sports-medal-ceremony.jpg" alt="Presidency University sports medal ceremony" loading="lazy">
                <figcaption>Recognition, teamwork and achievement.</figcaption>
              </figure>
            </div>
          </section>
          <!-- SPORTS-GALLERY-END -->
          '''
          body = s.lower().rfind("</body>")
          if body == -1:
              s += gallery
          else:
              s = s[:body] + gallery + "\n" + s[body:]
          p.write_text(s, encoding="utf-8")
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add sports gallery to portfolio homepage"
          git push
