name: Cultural Gallery Safe Inspect 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect without changing files
        shell: python
        run: |
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          print('size',len(text))
          print('gallery buttons',len(re.findall(r'cultural-gallery-item',text)))
          print('data urls',len(re.findall(r'data:image/[^;]+;base64,',text)))
          for pat in [r'const\s+\w*?[Cc]ultural\w*\s*=.*?;', r'function\s+openCulturalLightbox.*?\}', r'culturalGallery\w*']:
              hits=re.findall(pat,text,re.S)
              print('PATTERN',pat,'HITS',len(hits))
              for h in hits[:10]:
                  print(h[:1500].replace('base64,','base64,[DATA]'))
          for i,m in enumerate(re.finditer(r'<button[^>]*class="[^"]*cultural-gallery-item[^"]*"[\s\S]*?</button>',text),1):
              block=m.group(0)
              imgs=re.findall(r'<img\b[^>]*?src="([^"]+)"',block,re.S)
              print('ITEM',i,'IMG_COUNT',len(imgs),[(x[:30],len(x)) for x in imgs])

  install-experience-animation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cinematic Professional Experience animation
        run: python scripts/add_experience_animation.py
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed."
          else
            git add index.html
            git commit -m "Add cinematic Professional Experience animation"
            git push
          fi
