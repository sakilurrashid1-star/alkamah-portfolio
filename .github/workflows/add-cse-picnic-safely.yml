name: Add CSE Picnic Photos Safely

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-gallery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add photos to existing Cultural Moments gallery
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          p=Path('index.html'); text=p.read_text(encoding='utf-8')
          h=re.search(r'Cultural Moments',text,re.I)
          if not h: sys.exit('SAFE STOP: Cultural Moments not found')
          s=text.rfind('<section',0,h.start()); e=text.find('</section>',h.end())
          if s<0 or e<0: sys.exit('SAFE STOP: section not found')
          e+=10; section=text[s:e]
          if 'DSC07337.JPG' in section or 'CSE Picnic 2026' in section:
              print('Already present'); sys.exit(0)
          ms=list(re.finditer(r'<([\w:-]+)\b[^>]*class=["\'][^"\']*gallery[^"\']*["\'][^>]*>',section,re.I))
          if not ms: sys.exit('SAFE STOP: existing gallery container not found')
          m=ms[0]; tag=m.group(1); depth=0; close=None
          for x in re.finditer(r'<(/?)'+re.escape(tag)+r'\b[^>]*>',section[m.start():],re.I):
              if x.group(1): depth-=1
              elif not x.group(0).rstrip().endswith('/>'): depth+=1
              if depth==0 and x.group(1): close=m.start()+x.start(); break
          if close is None: sys.exit('SAFE STOP: gallery closing tag not found')
          im=re.search(r'class=["\']([^"\']*(?:gallery-item|cultural[^"\']*item)[^"\']*)["\']',section[m.end():close],re.I)
          cls=im.group(1) if im else 'cultural-gallery-item'
          photos=[('DSC07337.JPG','CSE Picnic 2026 – Stage Performance'),('DSC07351.JPG','CSE Picnic 2026 – Cultural Performance'),('DSC07355.JPG','CSE Picnic 2026 – Live Performance'),('DSC07357.JPG','CSE Picnic 2026 – Audience Moment'),('DSC07371.JPG','CSE Picnic 2026 – Cultural Moment')]
          add=''.join(f'\n<div class="{cls}"><img src="{fn}" alt="{alt}" loading="lazy"><div class="cultural-gallery-caption">CSE Picnic 2026</div></div>' for fn,alt in photos)
          new_section=section[:close]+add+section[close:]
          new=text[:s]+new_section+text[e:]
          if new.count('DSC07337.JPG')!=1 or any(fn not in new for fn,_ in photos): sys.exit('SAFE STOP: validation failed')
          p.write_text(new,encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Add original CSE Picnic 2026 photos to Cultural Moments'
          git push origin main
          git rm .github/workflows/add-cse-picnic-safely.yml
          git commit -m 'Remove temporary CSE Picnic workflow'
          git push origin main
