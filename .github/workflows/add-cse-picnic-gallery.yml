name: Add CSE Picnic 2026 gallery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert CSE Picnic gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- CSE-PICNIC-2026-GALLERY -->'
          if marker in s:
              print('Gallery already present')
              raise SystemExit(0)
          block = r'''<!-- CSE-PICNIC-2026-GALLERY -->
          <section id="cse-picnic-2026-gallery" style="margin:40px auto;max-width:1200px;padding:28px;border-radius:24px;background:rgba(255,255,255,.04);box-shadow:0 10px 40px rgba(0,0,0,.12)">
            <div style="text-align:center;margin-bottom:22px">
              <h2 style="margin:0 0 8px">CSE Picnic 2026</h2>
              <p style="margin:0;opacity:.75">Cultural Moments · Presidency University CSE</p>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">
              <img src="DSC07337.JPG" alt="CSE Picnic 2026 performance" loading="lazy" style="width:100%;height:300px;object-fit:cover;border-radius:18px;cursor:pointer">
              <img src="DSC07351.JPG" alt="CSE Picnic 2026 stage moment" loading="lazy" style="width:100%;height:300px;object-fit:cover;border-radius:18px;cursor:pointer">
              <img src="DSC07355.JPG" alt="CSE Picnic 2026 audience moment" loading="lazy" style="width:100%;height:300px;object-fit:cover;border-radius:18px;cursor:pointer">
              <img src="DSC07357.JPG" alt="CSE Picnic 2026 cultural moment" loading="lazy" style="width:100%;height:300px;object-fit:cover;border-radius:18px;cursor:pointer">
              <img src="DSC07371.JPG" alt="CSE Picnic 2026 cultural performance" loading="lazy" style="width:100%;height:300px;object-fit:cover;border-radius:18px;cursor:pointer">
            </div>
          </section>
          <script>
          document.addEventListener('DOMContentLoaded', function () {
            const gallery = document.getElementById('cse-picnic-2026-gallery');
            if (!gallery) return;
            const all = document.querySelectorAll('h1,h2,h3,h4,h5,h6,p,div,span,a');
            let target = null;
            for (const el of all) {
              const t = (el.textContent || '').trim().replace(/\s+/g,' ');
              if (t === 'Cultural Moments' || t.includes('Cultural Moments')) {
                target = el;
                break;
              }
            }
            if (target) {
              const parent = target.closest('section, article, .card, .content, .container') || target.parentElement;
              if (parent && parent.parentElement) parent.parentElement.insertBefore(gallery, parent.nextSibling);
            }
            gallery.querySelectorAll('img').forEach(img => {
              img.addEventListener('click', () => window.open(img.src, '_blank'));
            });
          });
          </script>
          '''
          s = s.replace('</body>', block + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add CSE Picnic 2026 original photos"
          git push