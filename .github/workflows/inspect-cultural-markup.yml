name: Fix Sports Section
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-sports:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate sports photos into the existing Sports Activities section
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          start=s.index('      <div id="sports-activities"')
          pos=start
          depth=0
          while True:
              a=s.find("<div",pos)
              b=s.find("</div>",pos)
              if b < 0:
                  raise SystemExit("Could not find end of Sports section")
              if a >= 0 and a < b:
                  depth += 1
                  pos = a + 4
              else:
                  depth -= 1
                  pos = b + 6
                  if depth == 0:
                      end=pos
                      break
          lines=[
          '      <div id="sports-activities" class="rounded-3xl p-8 md:p-10 border border-accent/20 bg-accent/[0.04] scroll-mt-24">',
          '        <div class="flex items-center gap-4 mb-5">',
          '          <div class="w-12 h-12 rounded-xl flex items-center justify-center bg-accent/15 text-accent"><i class="fas fa-trophy"></i></div>',
          '          <div><p class="text-sm text-accent font-semibold uppercase tracking-wider">Segment 03</p><h3 class="text-3xl font-bold">Sports Activities</h3></div>',
          '        </div>',
          '        <p class="text-gray-400 mb-7">Football, team leadership, competition, achievements, and memorable moments from Presidency University CSE sports activities.</p>',
          '        <div class="grid md:grid-cols-2 gap-5">',
          '          <figure class="group overflow-hidden rounded-2xl border border-white/10 bg-black/20">',
          '            <img src="assets/sports-medal-ceremony.jpg" alt="Presidency University sports medal ceremony and team recognition" class="w-full h-[320px] object-cover transition duration-500 group-hover:scale-105" loading="lazy">',
          '            <figcaption class="p-4"><h4 class="font-bold text-white">Recognition &amp; Achievement</h4><p class="text-sm text-gray-500 mt-1">A memorable sports recognition moment with teammates and fellow participants.</p></figcaption>',
          '          </figure>',
          '          <figure class="group overflow-hidden rounded-2xl border border-white/10 bg-black/20">',
          '            <img src="assets/sports-football-action.jpg" alt="Presidency University CSE football match and team moments" class="w-full h-[320px] object-cover transition duration-500 group-hover:scale-105" loading="lazy">',
          '            <figcaption class="p-4"><h4 class="font-bold text-white">Football &amp; Team Spirit</h4><p class="text-sm text-gray-500 mt-1">Match action, team coordination, and the competitive spirit of CSE football.</p></figcaption>',
          '          </figure>',
          '        </div>',
          '        <div class="grid sm:grid-cols-3 gap-4 mt-5">',
          '          <div class="rounded-2xl border border-white/10 bg-black/10 p-5"><i class="fas fa-futbol text-accent mb-3"></i><h4 class="font-bold">Football</h4><p class="text-sm text-gray-500 mt-1">Active participation in university football activities and tournaments.</p></div>',
          '          <div class="rounded-2xl border border-white/10 bg-black/10 p-5"><i class="fas fa-people-group text-accent mb-3"></i><h4 class="font-bold">Teamwork</h4><p class="text-sm text-gray-500 mt-1">Building coordination, communication, and team spirit on the field.</p></div>',
          '          <div class="rounded-2xl border border-accent/30 bg-accent/[0.06] p-5"><i class="fas fa-crown text-accent mb-3"></i><h4 class="font-bold">Leadership</h4><p class="text-sm text-gray-500 mt-1">Leadership experience through team participation and captaincy.</p></div>',
          '        </div>',
          '      </div>'
          ]
          s=s[:start]+"\n".join(lines)+s[end:]
          s=re.sub(r'\s*<!-- SPORTS-GALLERY-START -->.*?<!-- SPORTS-GALLERY-END -->\s*','\n',s,flags=re.S)
          p.write_text(s,encoding="utf-8")
      - name: Commit final update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sports-gallery.yml
          git add index.html
          git commit -m "Integrate sports photos into Sports Activities"
          git push
